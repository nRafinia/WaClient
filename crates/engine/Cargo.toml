[package]
name = "wa_engine"
version.workspace = true
edition.workspace = true

[dependencies]
whatsapp-rust.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
# Proxy support. All of these are already in the lock file through
# whatsapp-rust; the engine names them to build its own transport and agent.
# ureq's `socks-proxy` is the only feature that is newly switched on.
ureq = { version = "3.5", default-features = false, features = ["rustls", "socks-proxy"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
tokio-websockets = { version = "0.13", features = ["client", "rand"] }
http = "1"
# TCP keepalive on the proxied socket; already in the lock file.
socket2 = { version = "0.6", features = ["all"] }
anyhow.workspace = true
log.workspace = true
image.workspace = true
sha2.workspace = true
wa_store.workspace = true
whatlang = "0.18.0"
serde_json.workspace = true


[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["test-util"] }
